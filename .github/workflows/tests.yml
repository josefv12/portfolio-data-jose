name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: ${{ github.workspace }}/04-churn-prediction-ml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest scikit-learn joblib

      - name: Run portfolio tests
        run: |
          pytest shared/tests 01-retail-revenue-optimization/tests -q
          cd 04-churn-prediction-ml
          pytest tests -q
